<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Documents – Empty State | PSU CMS</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/cms-base.css">
  <link rel="stylesheet" href="../assets/css/cms-layout.css">
  <link rel="stylesheet" href="../assets/css/cms-components.css">
  <link rel="stylesheet" href="../assets/css/admin-resources.css">
</head>
<body class="cms-body" data-page="all-documents" data-title="All Documents – Empty State" data-crumb="Resources" data-demo-empty="1">

<main class="cms-content" id="main">
  <div class="cms-page-head">
    <div>
      <h1 class="cms-page-title">All Documents</h1>
      <p class="cms-page-sub">Manage official downloadable documents.</p>
    </div>
    <a class="cms-btn cms-btn-primary" href="upload-document.html">+ Upload Document</a>
  </div>
  <section class="cms-card" aria-label="Documents">
    <form class="cms-filters" id="documentFilters" role="search">
      <div class="cms-filter-search"><label class="cms-visually-hidden" for="documentSearch">Search</label><input class="cms-input" id="documentSearch" type="search" placeholder="Search..." autocomplete="off" maxlength="100"></div>
      <select id="filterCategory" data-cms-select aria-label="All Categories"><option value="">All Categories</option></select>
      <select id="filterType" data-cms-select aria-label="All File Types"><option value="">All File Types</option></select>
    </form>
    <div class="cms-table-wrap" id="documentTable">
      <table class="cms-table res-table res-documents-table">
        <thead><tr><th scope="col">Document</th><th scope="col">Type</th><th scope="col">Category</th><th scope="col">Size</th><th scope="col">Uploaded</th><th scope="col">By</th><th scope="col">Actions</th></tr></thead>
        <tbody id="documentRows"></tbody>
      </table>
    </div>
    <div id="documentEmpty"></div>
    <div id="documentFooter"></div>
  </section>
</main>
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-common.js"></script>
<script src="../assets/js/admin-documents.js"></script>
</body>
</html>
