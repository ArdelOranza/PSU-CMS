<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Personnel | PSU CMS</title>
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/cms-base.css">
  <link rel="stylesheet" href="../assets/css/cms-layout.css">
  <link rel="stylesheet" href="../assets/css/cms-components.css">
  <link rel="stylesheet" href="../assets/css/admin-resources.css">
</head>
<body class="cms-body" data-page="all-personnel" data-title="All Personnel" data-crumb="Website content">

<main class="cms-content" id="main">
  <div class="cms-page-head">
    <div>
      <h1 class="cms-page-title">All Personnel</h1>
      <p class="cms-page-sub">Manage faculty and staff directory.</p>
    </div>
    <a class="cms-btn cms-btn-primary" href="personnel-form.html">+ Add New Personnel</a>
  </div>
  <section class="cms-card" aria-label="Personnel">
    <form class="cms-filters" id="personnelFilters" role="search">
      <div class="cms-filter-search"><label class="cms-visually-hidden" for="personnelSearch">Search</label><input class="cms-input" id="personnelSearch" type="search" placeholder="Search..." autocomplete="off" maxlength="100"></div>
      <select id="filterCollege" data-cms-select aria-label="All Colleges"><option value="">All Colleges</option></select>
      <select id="filterDepartment" data-cms-select aria-label="All Departments"><option value="">All Departments</option></select>
    </form>
    <div class="cms-table-wrap" id="personnelTable">
      <table class="cms-table res-table res-personnel-table">
        <thead><tr><th scope="col">Photo</th><th scope="col">Full Name</th><th scope="col">Position</th><th scope="col">College / Department</th><th scope="col">Email</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>
        <tbody id="personnelRows"></tbody>
      </table>
    </div>
    <div id="personnelEmpty"></div>
    <div id="personnelFooter"></div>
  </section>
</main>
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin-common.js"></script>
<script src="../assets/js/admin-personnel.js"></script>
</body>
</html>
