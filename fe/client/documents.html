<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Library | Pangasinan State University</title>
  <meta name="description" content="Download official forms, policies, reports, and memoranda.">
  <link rel="icon" href="../assets/images/psu-logo.png" type="image/png">
  <link rel="stylesheet" href="../assets/css/client-variables.css">
  <link rel="stylesheet" href="../assets/css/client-global.css">
  <link rel="stylesheet" href="../assets/css/client-header.css">
  <link rel="stylesheet" href="../assets/css/client-footer.css">
  <link rel="stylesheet" href="../assets/css/client-layout.css">
  <link rel="stylesheet" href="../assets/css/client-listing.css">
  <link rel="stylesheet" href="../assets/css/client-resources.css">
</head>
<body data-nav="resources" data-staff-only="1">
<!-- Header and footer come from assets/js/client-shell.js (copied from the existing PSU public header/footer) -->
<div id="site-header-slot"></div>
<main id="main">
  <section class="page-head">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="../index.html">Home</a></li><li>Resources</li><li aria-current="page" id="crumbLeaf">Documents</li></ol></nav>
      <h1 class="page-title">Document Library</h1>
      <p class="page-lead">Download official forms, policies, reports, and memoranda.</p>
    </div>
  </section>
  <div class="container listing-body">
    <form class="listing-toolbar" id="docForm" role="search">
      <div class="listing-search"><svg class="listing-search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><label class="visually-hidden" for="doc-search">Search by title</label><input id="doc-search" type="search" maxlength="100" placeholder="Search by title" autocomplete="off"></div>
      <label class="visually-hidden" for="doc-category">Category</label><select class="listing-select" id="doc-category"><option value="">All categories</option></select>
      <label class="visually-hidden" for="doc-date">Upload date</label><select class="listing-select" id="doc-date"><option value="">Any upload date</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option><option value="1y">Last 12 months</option></select>
    </form>
    <ul class="chips" id="docChips" aria-label="Filter by category"></ul>
    <div class="listing-empty" id="docEmpty" hidden></div>
    <ul class="doc-list" id="docList"></ul>
    <div id="docPager"></div>
  </div>
</main>
<div id="site-footer-slot"></div>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/client-header.js"></script>
<script src="../assets/js/client-shell.js"></script>
<script src="../assets/js/client-documents.js"></script>
</body>
</html>
